[package]
name = "lighthugger-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal player for SomaFM with a visualizer that moves on the actual audio"
license = "MIT"
repository = "https://github.com/mrdfuse/lighthugger-tui"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.15"
libc = "0.2"
ratatui = "0.29"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = "thin"
strip = true
